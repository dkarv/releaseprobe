[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releaseprobe"
dynamic = ["version"]
description = "Find release notes, URLs and metadata from container labels and tags."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "David Punzet", email = "d.punzet@testbirds.de" }]
keywords = ["docker", "oci", "container", "release-notes", "labels"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = ["packaging>=24"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/dkarv/releaseprobe"
Repository = "https://github.com/dkarv/releaseprobe"
Issues = "https://github.com/dkarv/releaseprobe/issues"

[project.scripts]
releaseprobe = "releaseprobe.cli:main"

[tool.hatch.version]
path = "src/releaseprobe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/releaseprobe"]

[tool.pytest.ini_options]
addopts = "--cov=releaseprobe --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["releaseprobe"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
